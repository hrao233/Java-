name: Windows installer verification

on:
  push:
    branches: [main, feature/phase-4.0-release]
    paths:
      - 'scripts/**'
      - 'packaging/**'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exercise-installer:
    runs-on: windows-2025
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Extract pinned tools for this runner
        shell: pwsh
        run: |
          $tools = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'release-tools')
          $lock = Get-Content -Raw packaging/windows-lock.json | ConvertFrom-Json
          foreach ($item in @('jdk', 'mavenDistribution', 'wix')) {
              $tool = $lock.$item
              $zip = Join-Path $tools "$item.zip"
              Invoke-WebRequest -Uri $tool.url -OutFile $zip -TimeoutSec 300
              $algorithm = if ($tool.sha512) { 'SHA512' } else { 'SHA256' }
              $hash = if ($tool.sha512) { $tool.sha512 } else { $tool.sha256 }
              if ((Get-FileHash -LiteralPath $zip -Algorithm $algorithm).Hash -ne $hash) {
                  throw "Unexpected download hash for $item"
              }
              Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $tools $item)
          }
          $jdk = @(Get-ChildItem (Join-Path $tools 'jdk') -Directory)
          $maven = @(Get-ChildItem (Join-Path $tools 'mavenDistribution') -Directory)
          if ($jdk.Count -ne 1 -or $maven.Count -ne 1) { throw 'Unexpected tool archive layout' }
          "JAVA_HOME=$($jdk[0].FullName)" >> $env:GITHUB_ENV
          "WIX_PORTABLE=$($tools.FullName)\wix" >> $env:GITHUB_ENV
          "$($maven[0].FullName)\bin" >> $env:GITHUB_PATH
      - name: Build installers for 1.0.0 and the simulated upgrade
        shell: pwsh
        run: |
          $assets = Join-Path $env:RUNNER_TEMP 'release-assets'
          ./scripts/build-windows.ps1 -WixDirectory $env:WIX_PORTABLE -Tests Skip `
              -InstallerTestVersion 1.0.1 -OutputDirectory $assets
      - name: Verify the per-user installation lifecycle
        shell: pwsh
        run: |
          $assets = Join-Path $env:RUNNER_TEMP 'release-assets'
          ./scripts/test-windows-installation.ps1 `
              -Setup (Join-Path $assets 'JavaFXFileManager-1.0.0-windows-x64-setup.exe') `
              -Upgrade (Join-Path $assets 'JavaFXFileManager-1.0.1-windows-x64-upgrade-test.exe') `
              -UseMsiPayload -SkipShortcutLaunch `
              -FixtureDirectory (Join-Path $env:RUNNER_TEMP 'installation fixtures') |
              Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
