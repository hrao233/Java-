function showToast(msg){document.querySelector('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.textContent=msg;document.body.append(e);clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.remove(),2200)}
function section(c,s){let n=entries(c,c.path,true).length;return `<div class="sectionbar"><strong>${esc(c.path.at(-1))}</strong><span class="count">${n} 项</span>${c.query?`<span class="count">筛选：${esc(c.query)}</span>`:''}<span class="spacer"></span>${c.mode==='columns'?'':`<button class="tool" data-act="view" data-pane="${s}">${ico(c.view==='detail'?'list':'grid')} ${c.view==='detail'?'详细信息':'图标'} ${ico('down')}</button>`}</div>`}
function details(c){let list=entries(c,c.path,true);if(!list.length)return `<div class="empty">${ico('folder')}<div>${c.query?'没有匹配项目':'此文件夹为空'}</div></div>`;if(c.view==='grid')return `<div class="tiles">${list.map(([n,v])=>`<button class="tile ${c.selected===n?'sel':''}" data-item="${enc([n])}">${icon(v)}<span title="${esc(n)}">${esc(n)}</span></button>`).join('')}</div>`;return `<div class="detail"><div class="headrow">${[['name','名称'],['date','修改日期'],['type','类型'],['size','大小']].map(([k,n])=>`<button class="${k}" data-sort="${k}">${n}${c.sort===k?(c.desc?' ↓':' ↑'):''}</button>`).join('')}</div>${list.map(([n,v])=>`<button class="filerow ${c.selected===n?'sel':''}" data-item="${enc([n])}" title="${esc(n)}"><span class="fname">${icon(v)}<span>${esc(n)}</span></span><span class="meta date">${isFile(v)?v.date:'2026-11-24'}</span><span class="meta type">${isFile(v)?v.type+' 文件':'文件夹'}</span><span class="meta size">${isFile(v)?v.size:'—'}</span></button>`).join('')}</div>`}
function columns(c,hybrid){let paths=Array.from({length:Math.max(1,c.path.length-(hybrid?1:0))},(_,i)=>c.path.slice(0,i+1));return `<div class="columns" data-scrollcols>${paths.map((p,i)=>{let last=i===paths.length-1;let list=entries(c,p,last&&!hybrid).filter(([n,v])=>!hybrid||!isFile(v));return `<div class="mcol ${last?'last':''}"><div class="mcolhead">${ico('folder')}<span>${esc(p.at(-1))}</span></div><div class="mlist">${list.map(([n,v])=>{let path=c.path[p.length]===n,sel=p.length===c.path.length&&c.selected===n;return `<button class="mrow ${path?'path':''} ${isFile(v)?'file':''} ${sel?'sel':''}" data-col="${enc([...p,n])}" title="${esc(n)}">${icon(v)}<span class="label">${esc(n)}</span>${isFile(v)?'':ico('chev','chev')}</button>`}).join('')||'<div class="empty">空目录</div>'}</div></div>`}).join('')}</div>`}
function pane(c,s){let activeClass=active===s?'active':'';let crumbs=(dual&&c.path.length>2?c.path.slice(-2):c.path);let offset=c.path.length-crumbs.length;return `<section class="pane ${dual?'dual':''} ${activeClass}" data-area="${s}"><div class="panenav">${bt('left','back','后退','nav-back',!c.history.length)}${bt('right','forward','前进','nav-back',!c.future.length)}${bt('up','up','上一级','',c.path.length===1)}${bt('refresh','refresh','刷新')}<div class="address">${dual&&offset?`<button class="crumb" data-nav="${enc(c.path.slice(0,offset))}">…</button>`:''}${crumbs.map((n,i)=>pathButton(c.path.slice(0,offset+i+1),n)).join('')}</div><div class="search ${searchOpen===s?'open':''}" data-searcharea="${s}">${ico('search')}<input data-search="${s}" placeholder="搜索此目录" value="${esc(c.query)}" aria-label="搜索此目录"></div></div><div class="panecontent">${c.mode==='columns'?section(c,s)+columns(c,false):c.mode==='hybrid'?`<div class="hybridtop">${columns(c,true)}</div>${section(c,s)}${details(c)}`:section(c,s)+details(c)}</div></section>`}
function inspectorHtml(c){let v=c.selected&&get(c.path)?.[c.selected],n=c.selected||c.path.at(-1);return `<aside class="inspector"><div class="inspecttitle">详细信息 ${bt('close','inspect','关闭检查器')}</div><div class="previewcard">${icon(v||{})}<strong>${esc(n)}</strong><span class="meta">${v&&isFile(v)?esc(v.type+' 文件'):'文件夹'}</span></div>${v&&isFile(v)&&['TXT','MD','JAVA','PY','CSV'].includes(v.type)?'<div class="previewtext">示例预览\n\nProject Aster\n2026-11-24\n\n• 整理实验数据\n• 核对项目记录\n• 生成交付报告</div>':''}<div class="inspectlabel">位置</div><div class="inspectvalue">${esc([...c.path,...(c.selected?[c.selected]:[])].join(' / '))}</div><div class="inspectlabel">大小</div><div class="inspectvalue">${v&&isFile(v)?esc(v.size):'—'}</div><div class="inspectlabel">修改日期</div><div class="inspectvalue">${v&&isFile(v)?esc(v.date):'—'}</div><div class="inspectlabel">说明</div><div class="inspectvalue">此处仅展示模拟元数据。</div></aside>`}
function render(){document.documentElement.classList.toggle('dark',theme==='dark'||theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.body.classList.toggle('compact',compact);let c=ctx();app.innerHTML=`<header class="titlebar"><span class="brand">${ico('folder')}</span><span>本地文件管理器</span><span class="badge">4.1.1 · 设计原型</span><span class="spacer"></span><span>仅模拟文件 · 不访问磁盘</span></header><div class="tabs">${tabs.map((t,i)=>`<div class="tab ${t.id===tab?'active':''}" data-tab="${t.id}" title="${esc(t.path.join(' / '))}">${ico(t.mode==='classic'?'folder':t.mode==='columns'?'columns':'hybrid')}<span class="name">${esc(t.path.at(-1))}</span><button class="close" data-close="${t.id}" aria-label="关闭标签">${ico('close')}</button></div>`).join('')}${bt('plus','newtab','新建标签页')}</div><div class="toolbar">${bt('sidebar','sidebar','显示或隐藏侧栏',sidebar?'active':'')}${tool('plus','新建','mock','strong')}${bt('cut','mock','剪切','optional')}${bt('copy','mock','复制','optional')}${bt('paste','mock','粘贴','optional')}${bt('rename','mock','重命名','optional')}${bt('trash','mock','移到回收站','optional')}<span class="sep"></span>${tool('sort','排序','sort','optional')}<span class="spacer"></span><div class="layoutpicker" aria-label="浏览布局">${Object.entries(modeNames).map(([m,n])=>`<button class="${c.mode===m?'active':''}" data-mode="${m}" title="${n}浏览">${ico(m==='classic'?'list':m)}<span>${n}</span></button>`).join('')}</div><span class="sep"></span>${tool('dual','双栏','dual',dual?'active':'')}${bt('inspect','inspect','详细信息与预览',inspector?'active':'')}${bt('settings','settings','外观设置')}</div><main class="workspace">${sidebar?`<aside class="sidebar"><div class="sidehead">快速访问</div>${sideitem('工作空间',['工作空间'],'home')}${sideitem('桌面',['桌面'],'folder')}${sideitem('下载',['下载'],'download')}${sideitem('文档',['文档'],'file')}${sideitem('图片',['图片'],'image')}<div class="sidehead">固定位置 ${ico('star')}</div>${sideitem('Project Aster',base,'folder')}${sideitem('课程资料',['工作空间','课程资料'],'folder')}${sideitem('交付资料',['工作空间','交付资料'],'folder')}<div class="sidehead">设备</div>${sideitem('项目工作卷 (D:)',['工作空间'],'disk')}<div class="sidehead">原型提示</div><div style="padding:4px 8px;color:var(--faint);font-size:11px">双击传统列表进入目录。<br>列式导航单击展开。</div></aside>`:''}<div class="panes">${pane(left(),'left')}${dual?pane(right,'right'):''}</div>${inspector?inspectorHtml(c):''}</main><footer class="foot"><span>${entries(c,c.path,true).length} 个项目${c.selected?' · 已选中 1 项':''}</span><span class="spacer"></span><span>${dual?(active==='left'?'左栏':'右栏')+' · ':''}${modeNames[c.mode]}浏览</span><span><i class="dot"></i>自动刷新（示意）</span><button data-act="density" title="切换列表密度">${compact?'紧凑':'标准'}密度</button></footer>`;app.querySelectorAll('[data-scrollcols]').forEach(el=>el.scrollLeft=el.scrollWidth);}
function popup(anchor,items){document.querySelector('.menu')?.remove();let m=document.createElement('div');m.className='menu';m.innerHTML=items.map(([name,act,check])=>`<button data-menu="${act}" class="${check?'checked':''}">${ico(check?'check':'file')} ${esc(name)}</button>`).join('');document.body.append(m);let r=anchor.getBoundingClientRect();m.style.left=Math.max(6,Math.min(innerWidth-m.offsetWidth-6,r.left))+'px';m.style.top=Math.min(innerHeight-m.offsetHeight-6,r.bottom+5)+'px';}
function handleAction(a,el,c){switch(a){case'newtab':{let t=context(c.path,c.mode);tabs.push(t);tab=t.id;active='left';render();break}case'sidebar':sidebar=!sidebar;render();break;case'dual':dual=!dual;if(!dual)active='left';render();break;case'inspect':inspector=!inspector;render();break;case'density':compact=!compact;render();break;case'up':if(c.path.length>1)navigate(c,c.path.slice(0,-1));break;case'back':if(c.history.length){c.future.push(c.path);navigate(c,c.history.pop(),false)}break;case'forward':if(c.future.length){c.history.push(c.path);navigate(c,c.future.pop(),false)}break;case'refresh':showToast('模拟目录已刷新');break;case'mock':showToast('设计原型：文件写入命令不执行');break;case'settings':popup(el,[['浅色主题','theme:light',theme==='light'],['深色主题','theme:dark',theme==='dark'],['跟随系统','theme:system',theme==='system'],['紧凑密度','density',compact]]);break;case'view':popup(el,[['详细信息','view:detail',c.view==='detail'],['图标视图','view:grid',c.view==='grid']]);break;case'sort':popup(el,[['按名称','sort:name',c.sort==='name'],['按修改日期','sort:date',c.sort==='date'],['按类型','sort:type',c.sort==='type'],['反转顺序','reverse',c.desc]]);break;}}
app.addEventListener('click',e=>{let el=e.target.closest('button,[data-tab],[data-searcharea]');let area=e.target.closest('[data-area]');let was=active;if(area)active=area.dataset.area;let c=ctx();if(!el){if(was!==active)render();return}let d=el.dataset;if(d.close){e.stopPropagation();let i=tabs.findIndex(t=>t.id===+d.close);tabs.splice(i,1);if(!tabs.length)tabs.push(context(['工作空间']));if(tab===+d.close)tab=tabs[Math.max(0,i-1)].id;active='left';render()}else if(d.tab){tab=+d.tab;active='left';render()}else if(d.mode){c.mode=d.mode;render()}else if(d.side){navigate(c,dec(d.side))}else if(d.nav){navigate(c,dec(d.nav))}else if(d.item){let n=dec(d.item)[0],key=c.id+":"+c.path.join("/")+":"+n,now=performance.now();if(lastItemClick?.key===key&&now-lastItemClick.time<500){lastItemClick=null;if(!isFile(get(c.path)?.[n]))navigate(c,[...c.path,n]);else{c.selected=n;inspector=true;render()}}else{lastItemClick={key,time:now};c.selected=n;render()}}else if(d.col){let p=dec(d.col);if(isFile(get(p))){if(c.path.join('/')!==p.slice(0,-1).join('/'))navigate(c,p.slice(0,-1));c.selected=p.at(-1);render()}else navigate(c,p)}else if(d.sort){c.desc=c.sort===d.sort?!c.desc:false;c.sort=d.sort;render()}else if(d.searcharea&&dual){if(searchOpen!==d.searcharea||was!==active){searchOpen=d.searcharea;render();app.querySelector(`[data-search="${searchOpen}"]`).focus()}}else if(d.act){handleAction(d.act,el,c)}else if(was!==active)render()});
app.addEventListener('input',e=>{if(!e.target.matches('[data-search]'))return;let s=e.target.dataset.search,c=which(s),pos=e.target.selectionStart;active=s;c.query=e.target.value;render();let next=app.querySelector(`[data-search="${s}"]`);next.focus();next.setSelectionRange(pos,pos)});
document.addEventListener('click',e=>{let b=e.target.closest('[data-menu]');if(b){let [k,v]=b.dataset.menu.split(':');let c=ctx();if(k==='theme')theme=v;else if(k==='density')compact=!compact;else if(k==='view')c.view=v;else if(k==='sort'){c.sort=v;c.desc=false}else if(k==='reverse')c.desc=!c.desc;document.querySelector('.menu')?.remove();render()}else if(!e.target.closest('.menu,[data-act="settings"],[data-act="sort"],[data-act="view"]'))document.querySelector('.menu')?.remove()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelector('.menu')?.remove();if(searchOpen){searchOpen=null;render()}}if(e.key==='F6'){e.preventDefault();if(dual){active=active==='left'?'right':'left';render()}}});render();
</script></body></html>
